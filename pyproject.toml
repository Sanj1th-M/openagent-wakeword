[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent-wakeword"
version = "0.1.0"
description = "Local wake-word detector prototype for openagent."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary prototype; see README for third-party model licensing notes." }
authors = [{ name = "openagent" }]
dependencies = [
    "numpy>=1.26,<3",
    "openwakeword==0.6.0",
    "sounddevice>=0.5.6,<0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
openagent-wakeword-models = "openagent_wakeword.model_assets:main"
openagent-wakeword-listener = "openagent_wakeword.runner:main"
openagent-wakeword-startup = "openagent_wakeword.startup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: none
      # Read-only permissions are sufficient; no write access granted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          # No token needed; contents read-only is sufficient

      - name: Set up Python 3.12
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -e ".[dev]"

      - name: Verify dependency integrity
        run: python -m pip check

      - name: Run test suite
        run: python -m pytest

      - name: Install build tool
        run: python -m pip install build

      - name: Build wheel
        run: python -m build --wheel
